<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=1440, initial-scale=1.0" />
<title>LOAM · Screen 2 — Materials &amp; rubric setup</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet" />
<style>
  :root {
    --brand-blue: #1E7CE8;
    --brand-blue-soft: #E8F2FF;
    --brand-orange: #F37920;
    --brand-orange-soft: #FFF1E5;

    --gray-50:  #FAFAF9;
    --gray-100: #F4F4F2;
    --gray-200: #E7E5E0;
    --gray-300: #D4D2CC;
    --gray-400: #A8A6A0;
    --gray-500: #6B6964;
    --gray-600: #4A4844;
    --gray-700: #2C2A26;
    --gray-900: #0F0E0C;

    --success: #16A34A;
    --success-soft: #DCFCE7;

    --radius-card: 10px;
    --radius-btn: 6px;
    --radius-input: 6px;

    --font-sans: 'Plus Jakarta Sans', -apple-system, BlinkMacSystemFont, sans-serif;
    --font-mono: 'JetBrains Mono', ui-monospace, SFMono-Regular, monospace;
  }

  *, *::before, *::after { box-sizing: border-box; }
  html, body { margin: 0; padding: 0; height: 100%; }
  body {
    font-family: var(--font-sans);
    color: var(--gray-700);
    background: var(--gray-50);
    font-size: 14px; line-height: 1.5;
    -webkit-font-smoothing: antialiased;
    -moz-osx-font-smoothing: grayscale;
    min-width: 1200px;
    height: 100vh; overflow: hidden;
    display: flex; flex-direction: column;
  }
  button { font-family: inherit; cursor: pointer; border: none; background: none; }

  /* ===== Top bar ===== */
  .topbar {
    flex-shrink: 0;
    height: 52px;
    background: #fff;
    border-bottom: 1px solid var(--gray-200);
    display: flex; align-items: center;
    padding: 0 20px;
  }
  .wordmark { font-weight: 600; color: var(--brand-orange); font-size: 15px; letter-spacing: -0.01em; }
  .breadcrumb {
    margin-left: 16px;
    color: var(--gray-500); font-size: 13px; font-weight: 500;
    display: flex; align-items: center;
  }
  .breadcrumb .sep { color: var(--gray-300); margin: 0 8px; }
  .breadcrumb .current { color: var(--gray-700); }
  .topbar-right { margin-left: auto; display: flex; align-items: center; gap: 12px; }
  .search {
    display: flex; align-items: center; gap: 8px;
    background: var(--gray-100);
    border: 1px solid transparent;
    border-radius: var(--radius-input);
    padding: 6px 10px; width: 240px;
    font-size: 13px; color: var(--gray-500);
  }
  .search .kbd {
    margin-left: auto; font-family: var(--font-mono); font-size: 11px;
    padding: 1px 6px; background: #fff; border: 1px solid var(--gray-200);
    border-radius: 4px; color: var(--gray-500);
  }
  .icon-btn {
    width: 32px; height: 32px;
    display: inline-flex; align-items: center; justify-content: center;
    border-radius: var(--radius-btn); color: var(--gray-500); position: relative;
  }
  .icon-btn:hover { background: var(--gray-100); color: var(--gray-700); }
  .icon-btn .badge { position: absolute; top: 6px; right: 6px; width: 6px; height: 6px; border-radius: 50%; background: var(--brand-orange); border: 1.5px solid #fff; }
  .avatar {
    width: 28px; height: 28px; border-radius: 50%;
    background: var(--brand-blue-soft); color: var(--brand-blue);
    display: inline-flex; align-items: center; justify-content: center;
    font-weight: 600; font-size: 12px;
  }

  /* ===== Page (fills remaining height, no scroll) ===== */
  .page {
    flex: 1; min-height: 0;
    max-width: 1180px; width: 100%;
    margin: 0 auto;
    padding: 30px 40px;
    display: flex; flex-direction: column;
  }
  .page-head { display: flex; align-items: flex-start; gap: 20px; margin-bottom: 22px; }
  .page-head .ph-text { flex: 1; }
  .page-head h1 {
    margin: 0; font-size: 24px; font-weight: 600;
    color: var(--gray-900); letter-spacing: -0.02em;
  }
  .page-head p { margin: 6px 0 0; color: var(--gray-600); font-size: 14px; max-width: 640px; }

  /* Demo controls */
  .demo-ctrl { display: flex; gap: 8px; flex-shrink: 0; }
  .demo-btn {
    display: inline-flex; align-items: center; gap: 6px;
    height: 34px; padding: 0 14px;
    border-radius: var(--radius-btn);
    font-size: 13px; font-weight: 600;
    border: 1px solid var(--gray-200); background: #fff; color: var(--gray-700);
    transition: background .15s, border-color .15s, color .15s;
  }
  .demo-btn:hover { background: var(--gray-50); border-color: var(--gray-300); }
  .demo-btn.play { background: var(--brand-blue); color: #fff; border-color: transparent; }
  .demo-btn.play:hover { background: #176bcb; }

  /* ===== Slots row ===== */
  .slots {
    flex: 1; min-height: 0;
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    gap: 18px;
    align-items: stretch;
  }
  .mslot {
    position: relative;
    border-radius: var(--radius-card);
    display: flex; flex-direction: column;
    min-height: 280px;
    transition: border-color .2s, background .2s, box-shadow .2s;
  }

  /* ---- EMPTY state (dropzone) ---- */
  .mslot[data-state="empty"] {
    border: 2px dashed var(--gray-300);
    background: #fff;
    cursor: pointer;
  }
  .mslot[data-state="empty"]:hover,
  .mslot.dragover {
    border-color: var(--brand-blue);
    background: var(--brand-blue-soft);
  }
  .dz {
    flex: 1;
    display: flex; flex-direction: column;
    align-items: center; justify-content: center;
    text-align: center; padding: 24px;
    gap: 4px;
  }
  .dz-icon { color: var(--gray-400); margin-bottom: 8px; transition: color .2s, transform .2s; }
  .mslot[data-state="empty"]:hover .dz-icon,
  .mslot.dragover .dz-icon { color: var(--brand-blue); transform: translateY(-3px); }
  .dz-slot-name { font-size: 13px; font-weight: 600; color: var(--gray-700); }
  .dz-title { font-size: 13px; font-weight: 500; color: var(--gray-600); margin-top: 6px; }
  .dz-sub { font-size: 11.5px; color: var(--gray-500); }
  .dz-kbd {
    margin-top: 10px; font-size: 11px; color: var(--gray-400);
    display: inline-flex; align-items: center; gap: 5px;
  }

  /* ---- PARSING state ---- */
  .mslot[data-state="parsing"] {
    border: 1px solid var(--brand-blue);
    background: var(--brand-blue-soft);
  }
  .parsing-inner {
    flex: 1;
    display: flex; flex-direction: column;
    align-items: center; justify-content: center;
    text-align: center; padding: 24px; gap: 12px;
  }
  .parsing-inner .p-file {
    display: flex; align-items: center; gap: 8px;
    font-size: 12.5px; font-weight: 600; color: var(--gray-900);
  }
  .parsing-inner .p-file svg { color: var(--brand-blue); }
  .parsing-inner .p-status {
    font-size: 12.5px; color: #1456a8;
    display: flex; align-items: center; gap: 8px;
  }
  .spinner {
    width: 14px; height: 14px;
    border: 2px solid rgba(30,124,232,0.3);
    border-top-color: var(--brand-blue);
    border-radius: 50%;
    animation: spin .7s linear infinite;
  }
  @keyframes spin { to { transform: rotate(360deg); } }
  .parse-bar {
    width: 60%; height: 4px; background: rgba(30,124,232,0.18);
    border-radius: 999px; overflow: hidden;
  }
  .parse-bar .fill { height: 100%; width: 0; background: var(--brand-blue); border-radius: 999px; animation: parsefill 1.5s ease-in-out forwards; }
  @keyframes parsefill { from { width: 6%; } to { width: 100%; } }

  /* ---- PARSED state ---- */
  .mslot[data-state="parsed"] {
    border: 1px solid var(--gray-200);
    background: #fff;
    padding: 18px;
    animation: fadein .3s ease-out;
  }
  .mslot[data-state="parsed"].narayana {
    background: var(--brand-orange-soft);
    border-color: rgba(243,121,32,0.25);
  }
  @keyframes fadein { from { transform: translateY(6px); } to { transform: translateY(0); } }
  .parsed-inner { display: flex; flex-direction: column; flex: 1; }
  .slot-head { display: flex; align-items: center; gap: 10px; }
  .slot-icon {
    width: 30px; height: 30px; flex-shrink: 0;
    border-radius: 7px; background: var(--gray-100);
    display: inline-flex; align-items: center; justify-content: center;
    color: var(--gray-600);
  }
  .narayana .slot-icon { background: #fff; color: var(--brand-orange); }
  .slot-title { font-size: 13.5px; font-weight: 600; color: var(--gray-900); }
  .slot-pill {
    margin-left: auto;
    display: inline-flex; align-items: center; gap: 4px;
    padding: 2px 8px; border-radius: 999px;
    font-size: 10px; font-weight: 600;
    letter-spacing: 0.04em; text-transform: uppercase;
    background: var(--success-soft); color: #15803d;
  }
  .slot-pill svg { width: 10px; height: 10px; }
  .slot-file { margin-top: 14px; font-size: 13px; font-weight: 500; color: var(--gray-700); line-height: 1.4; }
  .slot-meta { margin-top: 4px; font-family: var(--font-mono); font-size: 11px; color: var(--gray-600); }
  .recognised { margin-top: auto; padding-top: 14px; display: flex; flex-wrap: wrap; gap: 6px; }
  .chip {
    display: inline-flex; align-items: center; gap: 5px;
    padding: 3px 9px;
    background: #fff;
    border: 1px solid rgba(243,121,32,0.3);
    border-radius: var(--radius-btn);
    font-size: 11.5px; font-weight: 500; color: #b45309;
  }
  .chip svg { width: 10px; height: 10px; color: var(--brand-orange); }
  .slot-steps { margin-top: 14px; display: flex; flex-direction: column; gap: 7px; }
  .slot-step {
    display: flex; align-items: center; gap: 8px;
    font-size: 12px; color: var(--gray-700);
  }
  .slot-step .ss-n {
    font-family: var(--font-mono); font-size: 10px; font-weight: 600;
    color: var(--gray-600); background: var(--gray-100);
    border-radius: 4px; padding: 1px 5px; flex-shrink: 0;
  }
  .slot-step .ss-mark { margin-left: auto; font-family: var(--font-mono); font-size: 10.5px; font-weight: 600; color: var(--success); }

  /* ===== Footer CTA ===== */
  .footer {
    flex-shrink: 0;
    margin-top: 22px;
    display: flex; flex-direction: column; align-items: center; gap: 8px;
  }
  .btn-primary {
    display: inline-flex; align-items: center; justify-content: center; gap: 8px;
    height: 46px; padding: 0 28px;
    background: var(--brand-blue); color: #fff;
    border-radius: var(--radius-btn);
    font-size: 15px; font-weight: 600; letter-spacing: -0.005em;
    box-shadow: 0 4px 14px rgba(30,124,232,0.22);
    transition: background .15s, transform .12s, box-shadow .15s;
  }
  .btn-primary:hover:not(:disabled) { background: #176bcb; transform: translateY(-1px); }
  .btn-primary:disabled {
    background: var(--gray-100); color: var(--gray-400);
    box-shadow: none; cursor: not-allowed;
  }
  .cta-sub { font-size: 12.5px; color: var(--gray-500); }
</style>
</head>
<body>

<header class="topbar">
  <span class="wordmark">Narayana</span>
  <nav class="breadcrumb">
    <span>Class XII-A</span>
    <span class="sep">/</span>
    <span>Maths Pre-Board 1</span>
    <span class="sep">/</span>
    <span class="current">Setup</span>
  </nav>
  <div class="topbar-right">
    <div class="search" role="search">
      <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="11" cy="11" r="8"></circle><path d="m21 21-4.3-4.3"></path></svg>
      <span>Search…</span>
      <span class="kbd">⌘K</span>
    </div>
    <button class="icon-btn" aria-label="Notifications">
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M6 8a6 6 0 0 1 12 0c0 7 3 9 3 9H3s3-2 3-9"></path><path d="M10.3 21a1.94 1.94 0 0 0 3.4 0"></path></svg>
      <span class="badge"></span>
    </button>
    <div class="avatar" title="Anita Rao">AR</div>
  </div>
</header>

<div class="page">

  <div class="page-head">
    <div class="ph-text">
      <h1>Configure grading for this exam</h1>
      <p>Drop the rubric, your answer key, and any Narayana guidelines. LOAM parses each and grades all 30 papers at the step level.</p>
    </div>
    <div class="demo-ctrl">
      <button class="demo-btn play" id="play-all">
        <svg width="13" height="13" viewBox="0 0 24 24" fill="currentColor" stroke="none"><path d="M8 5v14l11-7z"></path></svg>
        Play demo
      </button>
      <button class="demo-btn" id="reset-all">Reset</button>
    </div>
  </div>

  <div class="slots" id="slots"></div>

  <div class="footer">
    <button class="btn-primary" id="start-btn" disabled>
      Start Grading 30 Papers
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12h14"></path><path d="m12 5 7 7-7 7"></path></svg>
    </button>
    <div class="cta-sub" id="cta-sub">Add all three materials to begin · 0 of 3 ready</div>
  </div>

</div>

<script>
  const FILE_ICON = '<svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"></path><polyline points="14 2 14 8 20 8"></polyline></svg>';
  const CHECK = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><path d="M20 6 9 17l-5-5"></path></svg>';
  const UPLOAD = '<svg width="30" height="30" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M4 14.899A7 7 0 1 1 15.71 8h1.79a4.5 4.5 0 0 1 2.5 8.242"></path><path d="M12 12v9"></path><path d="m16 16-4-4-4 4"></path></svg>';

  const SLOTS = [
    {
      id: 'rubric', name: 'Marking rubric',
      file: 'CBSE Class XII Mathematics Marking Scheme 2025-26',
      meta: '12 pages · parsed',
      parsing: 'Reading marking scheme…',
      body: `<div class="slot-steps">
        <div class="slot-step"><span class="ss-n">§3.2</span> Method marks awarded independently <span class="ss-mark">CBSE</span></div>
        <div class="slot-step"><span class="ss-n">§4.1</span> Equivalent methods earn full credit <span class="ss-mark">CBSE</span></div>
      </div>`
    },
    {
      id: 'answerkey', name: 'Stepwise answer key',
      file: 'Maths Pre-Board 1 Answer Key.pdf',
      meta: '8 pages · stepwise marks extracted',
      parsing: 'Extracting stepwise marks…',
      body: `<div class="slot-steps">
        <div class="slot-step"><span class="ss-n">Step 1</span> Apply integration by parts <span class="ss-mark">1 mark</span></div>
        <div class="slot-step"><span class="ss-n">Step 2</span> Integrate term-by-term <span class="ss-mark">1 mark</span></div>
      </div>`
    },
    {
      id: 'narayana', name: 'Narayana guidelines', narayana: true,
      file: 'Narayana_Grading_Guidelines_2025.pdf',
      meta: '6 pages · Narayana terms recognised',
      parsing: 'Reading Narayana guidelines…',
      body: `<div class="recognised">
        <span class="chip">${CHECK} I-Spark methodology</span>
        <span class="chip">${CHECK} Dual CBSE+JEE rubric</span>
        <span class="chip">${CHECK} Step-credit policy</span>
      </div>`
    },
  ];

  const slotsEl = document.getElementById('slots');
  const startBtn = document.getElementById('start-btn');
  const ctaSub = document.getElementById('cta-sub');
  const timers = {};

  function render(slot) {
    const el = document.getElementById('slot-' + slot.id);
    const state = el.dataset.state;
    if (state === 'empty') {
      el.classList.remove('narayana');
      el.innerHTML = `
        <div class="dz">
          <div class="dz-icon">${UPLOAD}</div>
          <div class="dz-slot-name">${slot.name}</div>
          <div class="dz-title">Drop file to upload</div>
          <div class="dz-sub">PDF or DOCX · max 10MB</div>
          <div class="dz-kbd">or click to browse</div>
        </div>`;
    } else if (state === 'parsing') {
      el.classList.toggle('narayana', false);
      el.innerHTML = `
        <div class="parsing-inner">
          <div class="p-file">${FILE_ICON} ${slot.file.length > 30 ? slot.file.slice(0, 28) + '…' : slot.file}</div>
          <div class="parse-bar"><div class="fill"></div></div>
          <div class="p-status"><span class="spinner"></span> ${slot.parsing}</div>
        </div>`;
    } else if (state === 'parsed') {
      el.classList.toggle('narayana', !!slot.narayana);
      el.innerHTML = `
        <div class="parsed-inner">
          <div class="slot-head">
            <span class="slot-icon">${FILE_ICON}</span>
            <span class="slot-title">${slot.name}</span>
            <span class="slot-pill">${CHECK} Parsed</span>
          </div>
          <div class="slot-file">${slot.file}</div>
          <div class="slot-meta">${slot.meta}</div>
          ${slot.body}
        </div>`;
    }
  }

  function setState(slot, state) {
    const el = document.getElementById('slot-' + slot.id);
    el.dataset.state = state;
    render(slot);
    updateCta();
  }

  function startParse(slot) {
    const el = document.getElementById('slot-' + slot.id);
    if (el.dataset.state !== 'empty') return;
    setState(slot, 'parsing');
    clearTimeout(timers[slot.id]);
    timers[slot.id] = setTimeout(() => setState(slot, 'parsed'), 1500);
  }

  function updateCta() {
    const parsed = SLOTS.filter(s => document.getElementById('slot-' + s.id).dataset.state === 'parsed').length;
    ctaSub.textContent = parsed === 3
      ? 'All materials ready · LOAM will process all 30 papers'
      : `Add all three materials to begin · ${parsed} of 3 ready`;
    startBtn.disabled = parsed !== 3;
  }

  // Build slot shells
  SLOTS.forEach(slot => {
    const el = document.createElement('div');
    el.className = 'mslot';
    el.id = 'slot-' + slot.id;
    el.dataset.state = 'empty';
    slotsEl.appendChild(el);
    render(slot);

    // Click to simulate drop → parse
    el.addEventListener('click', () => { if (el.dataset.state === 'empty') startParse(slot); });

    // Real drag & drop
    el.addEventListener('dragover', (e) => { e.preventDefault(); if (el.dataset.state === 'empty') el.classList.add('dragover'); });
    el.addEventListener('dragleave', () => el.classList.remove('dragover'));
    el.addEventListener('drop', (e) => { e.preventDefault(); el.classList.remove('dragover'); startParse(slot); });
  });

  // Demo controls
  document.getElementById('play-all').addEventListener('click', () => {
    SLOTS.forEach(s => setState(s, 'empty'));
    SLOTS.forEach((s, i) => setTimeout(() => startParse(s), i * 700));
  });
  document.getElementById('reset-all').addEventListener('click', () => {
    Object.values(timers).forEach(clearTimeout);
    SLOTS.forEach(s => setState(s, 'empty'));
  });

  updateCta();
</script>

<!-- ============ LOAM state wiring ============ -->
<script src="loam-store.js"></script>
<script src="loam-chrome.js"></script>
<script>
(function () {
  window.LOAM.ready.then(function () {
    var btn = document.getElementById('start-btn');
    if (!btn) return;
    btn.addEventListener('click', function () {
      if (btn.disabled) return;
      LOAM.setNarayana('parsed');
      LOAM.startGrading();
      window.location.href = 'screen-3-grading.html';
    });
  });
})();
</script>
<script src="pm-notes.js"></script>
</body>
</html>
